name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'doplus-backend/**'
      - 'doplus-frontend/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Maven
        run: mvn -f doplus-backend/pom.xml clean install

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps
        working-directory: ./doplus-frontend
      - name: Build React app
        run: CI=false npm run build
        working-directory: ./doplus-frontend
      - name: Save build folder
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: ./doplus-frontend/build
  run-e2e-tests:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v2
      - name: Download the build folder
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./doplus-frontend/build
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install NPM dependencies
        run: npm install --legacy-peer-deps
        working-directory: ./doplus-frontend
      - name: run backend
        run: mvn -f doplus-backend/pom.xml spring-boot:run -Dspring-boot.run.profiles=test &
      - name: run frontend
        run: npm start &
        working-directory: ./doplus-frontend
      - name: run tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ./doplus-frontend
          install: false
          browser: chrome
          wait-on: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
